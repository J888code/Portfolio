<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorts and Searches</title>

    <!-- heading, body font -->
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>

        /* delete any default browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* global colour variables */
        :root {
            --red:     #e60000;
            --red-dim: #8b0000;
            --bg:      #000000;
            --text:    #e0e0e0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }


        /* sticky nav bar */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 60px;
            border-bottom: 1px solid #220000;
        }

        .nav-links {
            display: flex;
            gap: 60px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: color 0.3s, text-shadow 0.3s;
        }

        .nav-links a:hover {
            color: var(--red);
            text-shadow: 0 0 8px var(--red);
        }

        /* the hero fills the full first screen */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        /* wrapper to z-index to layer the logo behind the title */
        .header-wrapper {
            position: relative;
            display: inline-block;
        }

        /* centered image behind title text */
        .warning-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 900px;
            opacity: 1;
            z-index: 0;
        }

        /* main title — clamp(): the font size scales with screen width */
        h1 {
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            font-size: clamp(5rem, 14vw, 11rem);
            letter-spacing: 8px;
            color: #ffffff;
            text-shadow:
                0 0 10px var(--red),
                0 0 35px var(--red),
                0 0 70px rgba(230, 0, 0, 0.35);
            position: relative;
            z-index: 1;
            line-height: 1;
        }


        /* thin line between sections */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, #3d0000, transparent);
        }

        /* shared layout for the sorts and searches sections */
        .section {
            padding: 100px 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .section-label {
            font-size: 0.72rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #4a4a4a;
            margin-bottom: 8px;
        }

        .section h2 {
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            font-size: clamp(3rem, 8vw, 5rem);
            letter-spacing: 4px;
            margin-bottom: 16px;
        }


        .sorts-section {
            border-left: 5px solid var(--red);
            padding-left: 60px;
        }

        .sorts-section h2 {
            color: var(--red);
            text-shadow: 0 0 15px var(--red);
        }

        .searches-section {
            border-left: 5px solid var(--red-dim);
            padding-left: 60px;
        }

        .searches-section h2 {
            color: var(--red-dim);
            text-shadow: 0 0 15px var(--red-dim);
        }

        /* grid — two cards side by side */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
            width: 100%;
        }

        /* clicking anywhere navigates to the page */
        .card-link {
            display: block;
            text-decoration: none;
            transform: translateY(0);
            transition:
                transform 0.4s ease-out,
                filter    0.3s ease;
            filter: drop-shadow(0 0 1px #550000);
        }

        /* hover effects */
        .card-link:hover {
            transform: translateY(-20px);
            filter:
                drop-shadow(0 0 8px  rgba(230, 0, 0, 1.0))
                drop-shadow(0 0 20px rgba(230, 0, 0, 0.8))
                drop-shadow(0 0 45px rgba(230, 0, 0, 0.5));
        }

        /* every second card (right column) is flipped 180° so the slants face each other */
        .cards-grid .card-link:nth-child(even) {
            transform: translateY(0) rotate(180deg);
        }

        .cards-grid .card-link:nth-child(even):hover {
            transform: translateY(-20px) rotate(180deg);
            filter:
                drop-shadow(0 0 8px  rgba(230, 0, 0, 1.0))
                drop-shadow(0 0 20px rgba(230, 0, 0, 0.8))
                drop-shadow(0 0 45px rgba(230, 0, 0, 0.5));
        }

        /* the text inside right-column cards is counter-rotated so it reads the right way up */
        .cards-grid .card-link:nth-child(even) .card-name {
            transform: rotate(180deg) scaleY(1.5);
            transform-origin: center center;
        }

        /* card shape — left edge is straight, right edge slants inward (trapezoid) */
        .card {
            background: rgba(180, 0, 0, 0.1);
            clip-path: polygon(0% 0%, 100% 0%, 80% 100%, 0% 100%);
            padding: 50px 120px 50px 44px;
            min-height: 260px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        /* card text */
        .card-name {
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            font-size: 6.5rem;
            letter-spacing: 5px;
            color: #ffffff;
            white-space: nowrap;
            display: inline-block;
            line-height: 1;
            transform: scaleY(1.5);
            transform-origin: left center;
            -webkit-text-stroke: 1.5px rgba(0, 0, 0, 0.85);
            paint-order: stroke fill;
        }

        footer {
            text-align: center;
            padding: 50px 20px;
            border-top: 1px solid #1a0000;
            font-size: 0.8rem;
            color: #333;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        footer span {
            color: var(--red);
        }

    </style>
</head>
<body>



    <nav>
        <ul class="nav-links">

            <a href="PLACEHOLDER_SELECTION_SORT.html" class="card-link">

            </a>

            <a href="PLACEHOLDER_INSERTION_SORT.html" class="card-link">

            <a href="PLACEHOLDER_MERGE_SORT.html" class="card-link">

            <a href="PLACEHOLDER_QUICK_SORT.html" class="card-link">

    <div class="divider"></div>


    <section class="section searches-section" id="searches">
        <p class="section-label">Algorithm Type 02</p>
        <h2>SEARCHES</h2>
        <div class="cards-grid">

            <a href="PLACEHOLDER_LINEAR_SEARCH.html" class="card-link">
                <div class="card">
                    <h3 class="card-name">LINEAR</h3>
                </div>
            </a>

            <a href="PLACEHOLDER_BINARY_SEARCH.html" class="card-link">
                <div class="card">
                    <h3 class="card-name">BINARY</h3>

            </a>

            <a href="PLACEHOLDER_JUMP_SEARCH.html" class="card-link">

            </a>

            <a href="PLACEHOLDER_HASH_SEARCH.html" class="card-link">

        </div>
    </section>


    <footer>
        <p>
            <span>Jasmine</span>
            &nbsp;·&nbsp;
            <span>Emma</span>
            &nbsp;·&nbsp;
            <span>Jessie</span>
        </p>
    </footer>


</body>
</html>
